name: Validate PMS CLI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pms-cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and installed CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, contract and install tests
        run: pnpm test
      - name: Build the standalone CLI
        run: pnpm build:cli
      - name: Smoke-test the installed executable
        run: node dist/pms-cli.js doctor --format json

  readonly-e2e:
    name: Optional isolated PMS readonly E2E
    if: ${{ vars.PMS_E2E_READONLY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run readonly E2E
        env:
          PMS_E2E_READONLY: true
          PMS_E2E_BASE_URL: ${{ secrets.PMS_E2E_BASE_URL }}
          PMS_E2E_TOKEN: ${{ secrets.PMS_E2E_TOKEN }}
          PMS_E2E_PROJECT_ID: ${{ vars.PMS_E2E_PROJECT_ID }}
        run: pnpm verify:real-pms:readonly
